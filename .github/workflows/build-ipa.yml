name: Build DSHPhone IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 看看编译环境
        run: |
          xcodebuild -version
          sw_vers

      - name: 装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project DSHPhone.xcodeproj \
            -scheme DSHPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | tail -60

      - name: 打包成 IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/DSHPhone.app"
          test -d "$APP" || { echo "没找到 $APP"; ls -R build/Build/Products || true; exit 1; }
          rm -rf Payload DSHPhone.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DSHPhone.ipa Payload
          ls -lh DSHPhone.ipa
          shasum -a 256 DSHPhone.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DSHPhone-ipa
          path: DSHPhone.ipa
          retention-days: 30

      - name: 编译日志（失败时看这个）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
