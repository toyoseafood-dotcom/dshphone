name: DSHPhone
options:
  bundleIdPrefix: com.yuchuan
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"

schemes:
  DSHPhone:
    build:
      targets:
        DSHPhone: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  DSHPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Harness
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        # 注意：iOS 10+ 起，只要出现 NSAllowsLocalNetworking（或 InWebContent / ForMedia）
        # 之一，NSAllowsArbitraryLoads 就会被整个忽略。Tailscale 的 100.x IP 不算
        # "local networking"，所以之前两者并存导致 http 被 ATS 拦死。
        # 这里只留 InWebContent（WKWebView 专用放行），不再声明 NSAllowsLocalNetworking。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsArbitraryLoads: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuchuan.dshphone
        PRODUCT_NAME: DSHPhone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
